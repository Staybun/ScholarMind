spring:
  ai:
    mcp:
      client:
        enabled: true
        name: scholarmind-mcp-client
        version: 1.0.0
        initialized: true
        request-timeout: 60s
        type: SYNC
        root-change-notification: true
        toolcallback:
          enabled: true
        stdio:
          root-change-notification: true
          connections:
            filesystem:
              command: cmd.exe
              args:
                - /c
                - npx
                - -y
                - "@modelcontextprotocol/server-filesystem"
                - ${SCHOLARMIND_MCP_FILESYSTEM_ROOT:D:\IDEA\workspace\ScholarMind}
            github:
              command: docker
              args:
                - run
                - -i
                - --rm
                - -e
                - GITHUB_PERSONAL_ACCESS_TOKEN
                - -e
                - GITHUB_TOOLSETS
                - ghcr.io/github/github-mcp-server
                - --read-only
              env:
                GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN:}
                GITHUB_TOOLSETS: ${GITHUB_TOOLSETS:repos,issues,pull_requests}
            arxiv:
              command: cmd.exe
              args:
                - /c
                - uv
                - tool
                - run
                - arxiv-mcp-server
                - --storage-path
                - ${SCHOLARMIND_ARXIV_STORAGE:D:\IDEA\workspace\ScholarMind\papers\arxiv}
